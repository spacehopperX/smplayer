name: Build Windows 3D Fork Release

on:
  push:
    branches: [master, milestone-1-dual-screen, milestone-2-3d-output, milestone-3-mvhevc, milestone-4-stereo-subs]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [installer, portable]
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          repository: smplayer-dev/smplayer-build
          path: harness
      - name: Checkout application sources
        uses: actions/checkout@v4
        with:
          path: harness/packages/smplayer
          fetch-depth: 0
      - name: Prepare portable sources
        if: matrix.package == 'portable'
        shell: pwsh
        run: Move-Item harness/packages/smplayer harness/packages/smplayer-portable
      - name: Install Qt and compiler
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
      - name: Add compiler to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_64\bin"
      - name: Fetch themes and skins
        working-directory: harness
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/smplayer-dev/smplayer-themes.git packages/smplayer-themes
          if ($LASTEXITCODE -ne 0) { throw 'Theme checkout failed' }
          git clone --depth 1 https://github.com/smplayer-dev/smplayer-skins.git packages/smplayer-skins
          if ($LASTEXITCODE -ne 0) { throw 'Skin checkout failed' }
      - name: Unpack playback engines
        working-directory: harness
        shell: cmd
        run: call uncompress_players.cmd
      - name: Compile themes
        working-directory: harness
        shell: cmd
        run: call compile_themes.cmd
      - name: Compile installer application
        if: matrix.package == 'installer'
        working-directory: harness
        shell: cmd
        run: call compile_smplayer.cmd
      - name: Compile portable application
        if: matrix.package == 'portable'
        working-directory: harness
        shell: cmd
        run: call compile_smplayer.cmd pe
      - name: Stage installer application
        if: matrix.package == 'installer'
        working-directory: harness
        shell: cmd
        run: call install.cmd
      - name: Stage portable application
        if: matrix.package == 'portable'
        working-directory: harness
        shell: cmd
        run: call install.cmd pe
      - name: Validate staged runtime
        working-directory: harness
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          $folder = if ($env:PACKAGE_KIND -eq 'portable') { 'smplayer-portable' } else { 'smplayer-build' }
          $root = Join-Path 'packages/BUILD' $folder
          foreach ($file in @('smplayer.exe', 'mpv/mpv.exe', 'platforms/qwindows.dll')) {
            $path = Join-Path $root $file
            if (!(Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Missing runtime file: $path" }
          }
          $mpv = Join-Path (Resolve-Path $root) 'mpv/mpv.exe'
          $stdout = Join-Path $env:RUNNER_TEMP "mpv-version-$($env:PACKAGE_KIND).txt"
          $proc = Start-Process -FilePath $mpv -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout
          $banner = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          Write-Host $banner
          if ($proc.ExitCode -ne 0 -or $banner -notmatch 'mpv ') {
            throw "mpv runtime smoke test failed (exit=$($proc.ExitCode))"
          }
      - name: Build installer
        if: matrix.package == 'installer'
        working-directory: harness
        shell: cmd
        run: call nsis.cmd
      - name: Package and verify deliverable
        working-directory: harness
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          New-Item -ItemType Directory -Force ../deliverables | Out-Null
          $short = '${{ github.sha }}'.Substring(0, 12)
          if ($env:PACKAGE_KIND -eq 'portable') {
            $output = "../deliverables/smplayer-$short-windows-x64-portable.zip"
            Compress-Archive -Path packages/BUILD/smplayer-portable -DestinationPath $output -Force
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $output))
            try {
              $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              foreach ($required in @('smplayer-portable/smplayer.exe', 'smplayer-portable/mpv/mpv.exe', 'smplayer-portable/platforms/qwindows.dll')) {
                if ($required -notin $names) { throw "Portable ZIP missing $required" }
              }
            } finally { $zip.Dispose() }
          } else {
            $name = (Get-Content packages/BUILD/installer_filename.txt -TotalCount 1).Trim()
            $source = Join-Path 'packages/BUILD/output' $name
            if (!(Test-Path $source)) { throw "Installer missing: $source" }
            Copy-Item $source "../deliverables/smplayer-$short-windows-x64-setup-unsigned.exe"
          }
          $files = @(Get-ChildItem ../deliverables -File)
          if ($files.Count -ne 1 -or $files[0].Length -eq 0) { throw 'Invalid deliverable' }
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.package }}
          path: deliverables/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both packages
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release
          merge-multiple: true
      - name: Verify release set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          sha256sum *.exe *.zip > SHA256SUMS.txt
      - name: Publish commit-specific prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: SMPlayer development build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Windows x64 development packages built from ${{ github.sha }}.
            Installer is unsigned. Portable ZIP contains the unpacked application.
            Successful packaging does not establish hardware playback compatibility.
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
